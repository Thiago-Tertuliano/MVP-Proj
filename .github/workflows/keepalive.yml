name: Keepalive API

# O plano gratuito do Render hiberna a API após 15 min sem tráfego e a primeira requisição
# leva ~50s (o proxy do Vercel pode estourar o tempo). Um ping periódico mantém a API acordada.
# Configure a variável do repositório API_HEALTH_URL (ex.: https://relp-api.onrender.com/health).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "${{ vars.API_HEALTH_URL }}"
